[project]
name = "nix-devbox"
dynamic = ["version"]
description = "Merge multiple flake devShells, build Docker image, and run containers"
authors = [{ name = "林玮 (Jade Lin)", email = "linw1995@icloud.com" }]
dependencies = ["click>=8.0.0", "pyyaml>=6.0"]
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
nix-devbox = "nix_devbox.cli:cli"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.setuptools.package-data]
nix_devbox = ["_version.py"]

[tool.setuptools.dynamic]
version = {attr = "nix_devbox.__version__"}

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
